<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>健身紀錄</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健身紀錄">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  #a2hs{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:70;background:#202020;border:1px solid rgba(255,255,255,.08);
    border-radius:22px;padding:14px 44px 14px 16px;color:#fff;font-size:13.5px;line-height:1.6;box-shadow:0 18px 40px rgba(0,0,0,.6)}
  #a2hs b{color:#c6f432}
  #a2hs button{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;cursor:pointer}
</style>
<style>
  :root{
    --ink:#ffffff; --muted:rgba(235,238,236,.6); --line:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.065); --glass-b:rgba(255,255,255,.06); --cell:rgba(255,255,255,.06);
    --yellow:#c6f432; --yellow-d:#aedc1f; --yellow-soft:rgba(198,244,50,.16);
    --warn:#ff8f80; --warn-soft:rgba(255,143,128,.16);
    --calm:#9fd3b0; --calm-soft:rgba(159,211,176,.14);
    --btn:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
    --blur:blur(18px) saturate(140%);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#090a0a;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:
      radial-gradient(ellipse 55% 24% at 64% 42%, rgba(150,160,154,.26), transparent 70%),
      radial-gradient(ellipse 42% 18% at 16% 18%, rgba(130,135,128,.16), transparent 70%),
      radial-gradient(ellipse 60% 22% at 42% 88%, rgba(95,105,100,.14), transparent 70%),
      linear-gradient(180deg,#020202 0%,#111312 42%,#070808 72%,#000 100%)}
  .bgfx::after{content:"";position:absolute;inset:0;mix-blend-mode:overlay;opacity:.32;background-size:180px 180px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.6' numOctaves='1' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0' intercept='1'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  #app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:130px}
  header{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 16px 4px;
    background:rgba(10,11,11,.45);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .hello{font-size:24px;font-weight:500;margin:2px 2px 8px}
  .hello b{font-weight:800}
  .ym{text-align:center;font-size:14px;font-weight:500;color:rgba(255,255,255,.85);margin:0 0 4px}
  .days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 6px 8px;margin:0 -6px;scroll-snap-type:x proximity}
  .days::-webkit-scrollbar,.groups::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;width:40px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 7px;border-radius:999px;cursor:pointer;scroll-snap-align:center}
  .day .wk{font-size:10px;color:rgba(255,255,255,.65);font-weight:600}
  .day .dn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;background:rgba(255,255,255,.07)}
  .day.used .dn{background:rgba(198,244,50,.30)}
  .day.future .dn{color:rgba(255,255,255,.35)}
  .day.sel{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
  .day.today{background:rgba(255,255,255,.92);animation:todayGlow 2.6s ease-in-out infinite}
  .day.today .wk,.day.today .dn{color:#121413;background:transparent}
  @keyframes todayGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 6px 1px rgba(255,255,255,.35)}}

  /* 今天練哪個肌群 */
  .gbar{padding:6px 0 10px}
  .gbar .label{display:block;margin:0 2px 6px}
  .groups{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .groups .g{padding:9px 0;text-align:center}
  .g{flex:none;border:1px solid rgba(255,255,255,.08);background:var(--btn);color:#fff;border-radius:10px;padding:9px 14px;font-size:14.5px;cursor:pointer}
  .g.on{background:var(--yellow);color:#111;border-color:transparent;font-weight:700}

  main{padding:4px 16px}
  h3{font-size:13px;color:var(--muted);margin:16px 2px 8px;font-weight:600}
  .card{background:var(--glass);border:1px solid var(--glass-b);border-radius:14px;padding:14px 16px;margin-bottom:12px;
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .label{font-size:12px;color:var(--muted)}
  .sumhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed rgba(255,255,255,.10);flex-wrap:wrap}
  .sumhead b{font-size:17px;font-weight:600}
  .sumhead span{font-size:12px;color:var(--muted)}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .grid3 div{background:var(--cell);border-radius:10px;padding:8px 10px;min-width:0}
  .grid3 b{display:block;font-size:21px;font-weight:500;margin-top:2px;color:var(--yellow);white-space:nowrap;overflow:hidden}
  .grid3 b small{font-size:12px;margin-left:2px;color:var(--muted)}
  .empty{color:var(--muted);font-size:12.5px;padding:4px 0;line-height:1.7}

  /* 動作卡片 */
  .xc{cursor:pointer;padding:0;overflow:hidden}
  .xh{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 16px}
  .ord{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--yellow);color:#111}
  .xc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .swrap{position:relative;margin-bottom:12px}
  .swrap .xc{margin-bottom:0;transition:transform .22s ease;touch-action:pan-y}
  .swrap .xc.moving,.swdel.moving{transition:none}
  .swdel{position:absolute;right:0;top:0;bottom:0;width:0;overflow:hidden;border:0;border-radius:14px;background:var(--warn);color:#fff;font-family:inherit;font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;white-space:nowrap;cursor:pointer;transition:width .22s ease;padding:0}
  .swrap.dragging{position:relative;z-index:4;transition:none!important;scale:1.03}
  .swrap.dragging .xc{box-shadow:0 0 0 2px rgba(198,244,50,.7),0 18px 40px rgba(0,0,0,.6)!important;opacity:.96}
  .swrap.shift{transition:transform .18s ease}
  body.drag-on{user-select:none;-webkit-user-select:none;cursor:grabbing}
  .xc.moved{animation:moved .45s ease-out}
  @keyframes moved{0%{box-shadow:0 0 0 2px rgba(198,244,50,.7),0 10px 30px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(198,244,50,0),0 10px 30px rgba(0,0,0,.35)}}
  /* 依肌群統計 */
  .gst{display:grid;grid-template-columns:auto 1fr 1fr 1.45fr;gap:6px 8px;align-items:center}
  .gst>.label{font-size:11px}
  .gst .gn{font-size:13px;font-weight:700;background:var(--yellow);color:#111;border-radius:8px;padding:5px 9px;text-align:center;white-space:nowrap}
  .gst .v{background:var(--cell);border-radius:9px;padding:6px 9px;white-space:nowrap;overflow:hidden}
  .gst .v b{font-size:18px;font-weight:500;color:var(--yellow)}
  .gst .v small{font-size:11px;color:var(--muted);margin-left:2px}
  /* 日期彈出頁 */
  .dpbox{max-height:min(84vh,720px)}
  .dpbox .card{background:rgba(255,255,255,.05);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .dpbox .xc{cursor:default}
  .dpbox .xh{padding-bottom:6px}
  .dpbox .xsets{padding-bottom:6px}
  .dpbox .btn{width:100%;margin-top:4px;flex:none}
  .hbtn{flex:none;border:1px solid rgba(198,244,50,.35);background:rgba(198,244,50,.10);color:var(--yellow);font-family:inherit;font-size:12px;font-weight:600;padding:6px 9px;border-radius:9px;cursor:pointer;margin-right:auto}
  .hbtn:active{background:rgba(198,244,50,.25)}
  .xh .nm{flex:0 1 auto;min-width:0;font-size:18px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gt{font-size:10.5px;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.10);color:rgba(255,255,255,.75);margin-left:6px;vertical-align:3px;font-weight:600}
  .xsets{padding:0 16px}
  .srow{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px}
  .srow+.srow{border-top:1px solid var(--line)}
  .srow .no{width:44px;flex:none;color:var(--muted);font-size:12px}
  .srow .wr{flex:1;white-space:nowrap}
  .srow .wr b{color:var(--yellow);font-weight:500;font-size:17px;margin:0 1px}
  .srow .wr small{color:var(--muted);font-size:12px}
  .fb{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600;white-space:nowrap}
  .fb.f0{background:var(--warn-soft);color:var(--warn)}
  .fb.f1{background:var(--yellow-soft);color:var(--yellow)}
  .fb.f2{background:var(--calm-soft);color:var(--calm)}
  .xadd{margin:6px 12px 12px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(255,255,255,.16);color:#fff}
  .xadd:active{background:rgba(255,255,255,.08)}
  .addcard{width:100%;height:52px;margin:2px 0 12px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1.5px dashed rgba(255,255,255,.22);
    color:rgba(255,255,255,.85);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .addcard svg{width:20px;height:20px}
  .addcard:active{background:rgba(255,255,255,.06)}
  .stype{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:12px}
  .stype button{border:0;background:transparent;color:rgba(255,255,255,.7);font-family:inherit;font-size:15px;padding:10px 0;border-radius:9px;cursor:pointer}
  .stype button.on{background:rgba(255,255,255,.9);color:#121413;font-weight:700}
  .face{display:block;width:30px;height:30px;margin:0 auto 6px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .face .fill{fill:currentColor;stroke:none}
  .face path.fill{fill:currentColor;stroke:currentColor;stroke-width:1}
  .fb.wu{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
  .srow.wu .wr b{color:rgba(255,255,255,.75)}
  .xadd svg{width:24px;height:24px}
  .del,.sx{border:1px solid rgba(255,255,255,.08);background:var(--btn);color:var(--muted);font-size:12px;padding:6px 10px;border-radius:10px;cursor:pointer;flex:none}
  .sx{padding:4px 8px;font-size:11px}
  .del.armed,.sx.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
  /* 進步曲線 */
  .ctitle{font-size:17px;font-weight:600;margin-bottom:10px}
  .sel{position:relative;margin-bottom:12px}
  .selbtn{width:100%;display:flex;align-items:center;gap:8px;font-family:inherit;color:#fff;padding:12px 40px 12px 18px;border-radius:999px;background:#2a2a2a;border:0;cursor:pointer;position:relative;text-align:left}
  .selbtn span{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .selbtn small{font-size:12px;color:var(--muted)}
  .selbtn::after{content:"";position:absolute;right:18px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--yellow);border-bottom:1.6px solid var(--yellow);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
  .selbtn.open::after{transform:translateY(-30%) rotate(-135deg)}
  .dd{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;max-height:340px;overflow-y:auto;padding:8px;border-radius:22px;background:#202020;border:1px solid rgba(255,255,255,.06);box-shadow:0 18px 40px rgba(0,0,0,.6);animation:popIn .18s ease-out}
  .ddg{font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 12px 4px;letter-spacing:.5px}
  .ddi{display:flex;align-items:center;width:100%;border:0;background:transparent;color:#fff;font-family:inherit;font-size:15px;text-align:left;padding:10px 12px;border-radius:999px;cursor:pointer}
  .ddi:active{background:rgba(255,255,255,.06)}
  .ddi.on{background:var(--yellow);color:#000;font-weight:700}
  .ddi.on::after{content:"✓";margin-left:auto;font-weight:700}
  .chead{display:flex;gap:18px;margin-bottom:6px}
  .chead b{display:inline-block;font-size:22px;font-weight:500;margin-top:2px}
  .chead div{display:flex;flex-direction:column}
  .chead div>span{margin-bottom:0}
  .chead small{font-size:11px;color:var(--muted);margin-left:2px}
  .chead div{display:block}
  .chead .label{display:block}
  .chead b.up{color:var(--calm)} .chead b.dn{color:var(--warn)}
  .chart{position:relative;margin:0 -4px;touch-action:pan-y}
  .chart svg{display:block;overflow:visible}
  .chart .gl{stroke:rgba(255,255,255,.07);stroke-width:1}
  .chart .yl{fill:rgba(255,255,255,.45);font-size:10.5px;text-anchor:end}
  .chart .xl{fill:rgba(255,255,255,.5);font-size:10.5px;text-anchor:middle}
  .chart .pw{color:#c6f432} .chart .pr{color:#e6e6e6}
  .ptitle{font-size:12px;font-weight:600;color:rgba(255,255,255,.75);margin:6px 0 0 4px}
  .ptitle small{font-weight:400;color:var(--muted);margin-left:2px}
  .chead em{font-style:normal;font-size:12px;margin-left:6px;font-weight:600}
  .chead em.eq{color:var(--muted)} .chead em.up{color:var(--yellow)} .chead em.dn{color:var(--warn)}
  .chart .ln{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
  .chart .dt{fill:currentColor;stroke:none}
  .chart .dt.end{stroke:none}
  .chart .dt.hot{stroke:#fff;stroke-width:2}
  .chart .cx{stroke:rgba(255,255,255,.35);stroke-width:1;stroke-dasharray:3 3}
  .rng{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px;padding:4px;border-radius:12px;background:rgba(255,255,255,.05)}
  .rng button{border:0;background:transparent;color:rgba(255,255,255,.65);font-family:inherit;font-size:12px;padding:8px 0;border-radius:9px;cursor:pointer;white-space:nowrap}
  .rng button.on{background:var(--yellow);color:#111;font-weight:700}
  .cempty{height:210px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .tip{position:absolute;display:none;pointer-events:none;background:rgba(40,44,42,.96);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 10px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .tip b{display:block;font-size:15px;font-weight:600}
  .tip span{display:block;font-size:11.5px;color:var(--muted);line-height:1.5}
  /* 月曆 */
  .calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .calnav div{text-align:center}
  .calnav b{display:block;font-size:18px;font-weight:600}
  .calnav small{font-size:12px;color:var(--muted)}
  .calnav .x{font-size:22px;line-height:1}
  .calnav .x:disabled{opacity:.25}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .wkh{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
  .cd{aspect-ratio:1;border-radius:12px;border:1.5px solid transparent;background:rgba(255,255,255,.05);color:#fff;font-size:15px;font-weight:500;cursor:pointer;padding:0;font-family:inherit}
  .cd.blank{background:none;cursor:default}
  .cd.future{color:rgba(255,255,255,.3)}
  .cd.today{background:rgba(255,255,255,.9);color:#121413;font-weight:700}
  .cd.on{border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 10px rgba(198,244,50,.45),inset 0 0 8px rgba(198,244,50,.18)}
  .cd.today.on{color:#121413}
  .cd:active{filter:brightness(1.3)}

  /* 導覽、＋、霧 */
  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;
    width:calc(100% - 24px);max-width:456px;display:flex;gap:4px;padding:6px;border-radius:16px;
    background:rgba(30,33,32,.55);border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 30px rgba(0,0,0,.45);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .tabs button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.72);padding:11px 0;border-radius:11px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tabs button[data-tab=settings]{flex:.55}
  .tabs button{white-space:nowrap}
  .tabs button.on{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);color:#fff;font-weight:700}
  @media (prefers-reduced-motion: reduce){ .day.today{animation:none} }
  .fog{position:fixed;left:0;right:0;bottom:0;height:calc(140px + env(safe-area-inset-bottom));z-index:9;pointer-events:none;
    -webkit-backdrop-filter:blur(11px);backdrop-filter:blur(11px);
    background:linear-gradient(180deg,rgba(12,13,13,0) 0%,rgba(12,13,13,.28) 40%,rgba(12,13,13,.52) 75%,rgba(10,11,11,.70) 100%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.35) 25%,rgba(0,0,0,.8) 52%,#000 78%);
    mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.35) 25%,rgba(0,0,0,.8) 52%,#000 78%)}

  /* 彈出視窗（置中、背景模糊） */
  .pop{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px 14px;
    background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .2s ease-out}
  .pop.hidden{display:none}
  .pbox{width:100%;max-width:440px;max-height:min(86vh,680px);display:flex;flex-direction:column;overflow:hidden;
    background:rgba(24,27,26,.94);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px;
    box-shadow:0 18px 40px rgba(0,0,0,.5);animation:popIn .25s cubic-bezier(.2,.9,.3,1.2)}
  .pscroll{overflow-y:auto;min-height:0}
  .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .phead b{font-size:19px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .phead small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .x{border:1px solid rgba(255,255,255,.08);background:var(--btn);width:36px;height:36px;border-radius:10px;color:#fff;font-size:15px;cursor:pointer;flex:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

  input{font-family:inherit;font-size:16px;padding:10px 12px;width:100%;color:#fff;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)}
  input::placeholder{color:rgba(255,255,255,.4)}
  input:focus{outline:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  .field{margin-bottom:14px}
  .field>.label{display:block;margin-bottom:6px}
  .steps{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
  .stp{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 8px 10px}
  .stp .label{display:block;text-align:center;margin-bottom:6px}
  .unit{display:flex;gap:2px;width:max-content;margin:0 auto 6px;padding:2px;border-radius:999px;background:rgba(0,0,0,.35)}

  .stp .ctl{display:flex;align-items:center;justify-content:space-between;gap:2px}

  .btn.primary{flex:1;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.08))}
  .btn.primary.ready,.btn.yellow{background:var(--yellow);color:#111;border-color:transparent}

  .btn.danger.armed{background:var(--warn);color:#fff}

  .hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}
  .last{font-size:12px;color:var(--muted);margin:-4px 0 12px}

  /* 動作選單 */

  .chip.on{background:rgba(255,255,255,.9);color:#121413;border-color:transparent}

  .chip.mine{border-style:dashed;border-color:rgba(198,244,50,.4)}
  .padd{display:flex;gap:8px;border-top:1px dashed rgba(255,255,255,.10);padding-top:12px;flex:none}
  .padd input{flex:1}
  .padd .btn{flex:none;padding:10px 14px}

  /* 首次設定（滿版） */
  .onb{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;background:rgba(6,7,7,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .onb.hidden{display:none}
  .obox{width:100%;max-width:480px;display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
  .ostep{font-size:12px;color:var(--muted);margin-bottom:6px}
  .obox h1{font-size:25px;font-weight:600;margin:0 0 6px;line-height:1.35}
  .obox h1 em{font-style:normal;color:var(--yellow)}
  .obox p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 14px}
  .odots{display:flex;gap:6px;margin-bottom:16px}

  /* 常練動作 */

    background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}

  .mcard .mn{font-size:24px;font-weight:700}

  .chip.rm{background:rgba(255,255,255,.9);color:#121413;border-color:transparent}

  #toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;max-width:90%;text-align:center;
    background:rgba(60,66,63,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}

  /* ===== 新風格：純黑底、萊姆綠、膠囊與圓形按鈕、大圓角、斜線紋理 ===== */

    --card:#1b1b1b; --card2:#2a2a2a; --line:rgba(255,255,255,.07); --btn:#2a2a2a; --glass:#1b1b1b; --glass-b:rgba(255,255,255,.05); --cell:#262626; }

  /* 卡片內元素 */
  .xadd{border:1.5px solid rgba(255,255,255,.18);height:46px}
  .addcard{border:1.5px dashed rgba(255,255,255,.25);height:56px}

  .swdel{border-radius:26px}
  .gst .gn{color:#000}

  /* 日期條、月曆 */
  .day .dn{background:var(--card2)}

  .cd{border-radius:50%;background:var(--card2)}
  .cd.on{border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 12px rgba(198,244,50,.45),inset 0 0 8px rgba(198,244,50,.15)}
  .cd.today{background:#fff;color:#000}
  .cd.today.on{color:#000}
  /* 常練動作：方形卡片加斜線紋理角落 */
  .mcard{border-radius:28px;background:var(--card);border-color:var(--glass-b);box-shadow:none;position:relative;-webkit-backdrop-filter:none;backdrop-filter:none}
  .mcard>span{position:relative;z-index:1}
  .mcard::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#1b1b1b 0%,rgba(27,27,27,.92) 36%,rgba(27,27,27,.55) 52%,rgba(27,27,27,0) 72%)}
  .mcard>span{z-index:2}
  .mcard .ml{text-shadow:0 0 6px #1b1b1b,0 0 6px #1b1b1b}
  .mill{position:absolute;right:0;top:6px;bottom:6px;width:68%;height:calc(100% - 12px);object-fit:contain;object-position:right center;pointer-events:none;opacity:.95}
  .mill.half{top:0;bottom:0;height:100%}
  .mcard .mc b{color:var(--yellow)}
  /* 彈出視窗、導覽列 */
  .pbox{border-radius:30px;background:#161616}
  .tabs{border-radius:999px;background:rgba(28,28,28,.92);padding:6px}
  .tabs button{border-radius:999px}
  .tabs button.on{background:var(--yellow);color:#000;box-shadow:none}
  .tip{border-radius:16px}
  .rng{background:var(--card2)}
  .rng button.on{color:#000}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>

<!-- 首次設定：每個肌群選常用動作 -->

<script>
(() => {
  /* ===== 內建動作資料庫（參考 aworkoutroutine.com 各肌群動作清單，核心、臀腿另參考其他動作清單補充） ===== */
  const G = [
    ['chest','胸'],['back','背'],['shoulder','肩'],['leg','腿臀'],['biceps','二頭'],['triceps','三頭'],['core','核心']
  ];
  const LIB = {
    chest:['槓鈴臥推','啞鈴臥推','上斜槓鈴臥推','上斜啞鈴臥推','下斜臥推','機械胸推','上斜機械胸推','雙槓撐體（胸）','伏地挺身','啞鈴飛鳥','上斜啞鈴飛鳥','蝴蝶機夾胸','繩索夾胸'],
    back:['引體向上','反手引體向上','滑輪下拉','槓鈴划船','啞鈴單手划船','T 槓划船','坐姿繩索划船','機械划船','俯臥支撐划船','反向划船','聳肩','硬舉'],
    shoulder:['槓鈴肩推','啞鈴肩推','機械肩推','阿諾肩推','直立上提','啞鈴側平舉','繩索側平舉','機械側平舉','前平舉','反向飛鳥','臉拉'],
    leg:['槓鈴深蹲','前蹲舉','高腳杯深蹲','保加利亞分腿蹲','弓箭步','登階','腿推','單腿腿推','哈克深蹲','腿伸展','羅馬尼亞硬舉','直腿硬舉','相撲硬舉','腿彎舉','臀推','早安式','站姿提踵'],
    biceps:['槓鈴彎舉','啞鈴彎舉','牧師椅彎舉','坐姿啞鈴彎舉','上斜啞鈴彎舉','錘式彎舉','集中彎舉','繩索彎舉','機械彎舉'],
    triceps:['雙槓撐體（三頭）','窄握臥推','窄距伏地挺身','仰臥三頭伸展（碎顱者）','過頭三頭伸展','繩索下壓','椅子撐體'],
    core:['捲腹','機械捲腹','懸垂舉腿','平板支撐','俄羅斯轉體','繩索伐木','負重仰臥起坐','健腹輪']
  };
  const GN = Object.fromEntries(G);
  const FAIL = ['完全力竭','剩 1–2 下','剩 3 下以上'];
  const WK = ['日','一','二','三','四','五','六'];

  const DEMO = false;
  const KEY = DEMO ? 'gymlog-demo-v1' : 'gymlog-v2';
  let mem = null;
  const load = () => { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch(e){ return mem ? JSON.parse(mem) : null; } };
  const save = () => { mem = JSON.stringify(S); try { localStorage.setItem(KEY, mem); } catch(e){} };
  const S = load() || { name:'', setupDone:false, defaults:{}, custom:{}, days:{} };
  G.forEach(([k]) => { S.defaults[k] = S.defaults[k] || []; S.custom[k] = S.custom[k] || []; });

  /* ===== 示範用：產生過去半年的模擬訓練紀錄（正式版會關掉） ===== */
  function seedDemo(){
    let seed = 20261110; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    // [動作, 肌群, 起始重量, 半年後重量, 每次加重的級距, 基本次數]
    const P = {
      1:[['槓鈴臥推','chest',60,77.5,2.5,8],['上斜啞鈴臥推','chest',20,26,2,10],['蝴蝶機夾胸','chest',35,50,5,12],['繩索下壓','triceps',20,30,2.5,12],['仰臥三頭伸展（碎顱者）','triceps',20,27.5,2.5,10]],
      3:[['引體向上','back',0,0,0,8],['滑輪下拉','back',45,60,2.5,10],['槓鈴划船','back',50,67.5,2.5,8],['啞鈴彎舉','biceps',10,14,1,10],['錘式彎舉','biceps',10,14,1,10]],
      5:[['槓鈴深蹲','leg',70,100,2.5,6],['羅馬尼亞硬舉','leg',60,85,2.5,8],['腿推','leg',120,170,10,10],['腿彎舉','leg',35,47.5,2.5,12]],
      6:[['啞鈴肩推','shoulder',14,20,2,8],['啞鈴側平舉','shoulder',6,9,1,12],['捲腹','core',0,0,0,15],['懸垂舉腿','core',0,0,0,10]]
    };
    const now = new Date(), start = new Date(now.getFullYear(), now.getMonth() - 30, now.getDate());
    Object.values(P).flat().forEach(([n,g]) => { if (!S.defaults[g].includes(n)) S.defaults[g].push(n); });
    for (let d = new Date(start); d < now; d.setDate(d.getDate() + 1)){
      const plan = P[d.getDay()]; if (!plan || rnd() < 0.13) continue;           // 偶爾沒去
      const k = iso(d), prog = (d - start) / (now - start);                       // 0 → 1
      const wk = Math.floor((d - start) / 6048e5), deload = wk % 9 === 8; // 每 9 週一次減量週
      const D = { groups:[...new Set(plan.map(x => x[1]))], cards:[] };
      plan.forEach(([n,g,a,b,stp,reps]) => {
        const sets = [], ns = 3 + (rnd() < 0.4 ? 1 : 0);
        const wuW = stp ? Math.round((a + (b - a) * 2.4 * Math.sqrt(prog)) * 0.5 / stp) * stp : 0;
        if (wuW >= 20) sets.push({ w:wuW, r:10, wu:true, t:d.getTime() - 1 });
        const gain = (b - a) * 2.4 * Math.sqrt(prog);                               // 前期進步快、後期慢
        let w = stp ? Math.round((a + gain + (rnd() - 0.5) * stp * 0.5) / stp) * stp : 0;
        if (deload && stp) w = Math.round(w * 0.85 / stp) * stp;
        for (let i = 0; i < ns; i++){
          const last = i === ns - 1, r = Math.max(3, reps + (stp ? 0 : Math.round(prog * 4)) - (i ? i - 1 + (rnd() < 0.4 ? 1 : 0) : (rnd() < 0.15 ? 1 : 0)));
          sets.push({ w, r, f: deload ? 2 : last ? (rnd() < 0.5 ? 0 : 1) : (rnd() < 0.6 ? 2 : 1), t: d.getTime() + i });
        }
        D.cards.push({ id:uid(), ex:n, g, sets });
      });
      S.days[k] = D;
    }
    S.setupDone = true; save();
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const pad = n => String(n).padStart(2,'0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $ = id => document.getElementById(id);
  const kg = w => (Math.round(w * 100) / 100).toString();
  /* 重量單位：內部一律存公斤（w）；用磅輸入時另外記下原始磅數（lb），顯示時才不會有換算誤差 */
  const LB = 0.45359237;
  const U = () => S.unit === 'lb' ? 'lb' : 'kg';
  const dw = s => U() === 'lb' ? (s.lb != null ? s.lb : Math.round(s.w / LB * 10) / 10) : (s.lb != null ? Math.round(s.w * 10) / 10 : s.w);
  const wtxt = s => kg(dw(s));
  const allOf = g => LIB[g].concat(S.custom[g].filter(n => !LIB[g].includes(n)));
  const TODAY = iso(new Date());
  const day = d => S.days[d] || (S.days[d] = { groups:[], cards:[] });
  const label = s => { const d = parse(s); return (d.getMonth()+1) + '月' + d.getDate() + '日（' + WK[d.getDay()] + '）'; };

  let tab = 'day', sel = TODAY, armed = null, armT;
  function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
  function arm(k){ armed = k; clearTimeout(armT); armT = setTimeout(() => { armed = null; render(); }, 3000); render(); }

  /* ===== 頂部 ===== */
  function renderHeader(){
    $('hello').innerHTML = '嗨' + (S.name ? '，<b>' + esc(S.name) + '</b>' : '') + '！今天練什麼？';
    const used = new Set(Object.keys(S.days).filter(d => S.days[d].cards.some(c => c.sets.length)));
    const base = new Date(); let h = '';
    for (let i = -35; i <= 6; i++){
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i), k = iso(d), c = ['day'];
      if (k === TODAY) c.push('today'); else if (k > TODAY) c.push('future');
      if (used.has(k)) c.push('used'); if (k === sel && k !== TODAY) c.push('sel');
      h += '<div class="' + c.join(' ') + '" data-d="' + k + '"><span class="wk">' + WK[d.getDay()] + '</span><span class="dn">' + d.getDate() + '</span></div>';
    }
    $('days').innerHTML = h;
    const sd = parse(sel); $('ym').textContent = sd.getFullYear() + '年' + (sd.getMonth()+1) + '月';
    const D = S.days[sel] || { groups:[] };
    $('groups').innerHTML = G.map(([k,n]) => '<button class="g' + (D.groups.includes(k) ? ' on' : '') + '" data-g="' + k + '">' + n + '</button>').join('');
    ['gbar','ym','days'].forEach(id => $(id).style.display = tab === 'day' ? '' : 'none');
  }
  function centerDay(smooth){
    const strip = $('days'), el = strip.querySelector('[data-d="' + sel + '"]');
    if (el) strip.scrollTo({ left: el.offsetLeft - strip.clientWidth/2 + el.offsetWidth/2, behavior: smooth ? 'smooth' : 'auto' });
  }
  /* 點日期：彈出當天所有卡片與內容 */
  function openDay(d){
    const D = S.days[d] || { groups:[], cards:[] }, cs = D.cards.filter(c => c.sets.length);
    $('dpTitle').textContent = label(d); $('dpSub').textContent = d === TODAY ? '今天' : '';
    let h = '<div class="card">' + groupStats(D) + '</div>';
    h += D.cards.length ? D.cards.map((c, i) => '<div class="card xc"><div class="xh"><span class="ord">' + (i+1) + '</span><div class="nm">' + esc(c.ex) + '<span class="gt">' + GN[c.g] + '</span></div></div><div class="xsets">' +
      (c.sets.length ? setRows(c, true) : '<div class="empty">沒有記錄</div>') + '</div></div>').join('') : '<div class="empty" style="padding:8px 2px 14px">這天沒有訓練紀錄。</div>';
    if (d !== sel || tab !== 'day') h += '<button type="button" class="btn yellow" id="dpGo" data-d="' + d + '">' + (cs.length ? '到這天繼續編輯' : '在這天開始記錄') + '</button>';
    $('dpBody').innerHTML = h; $('dpBody').scrollTop = 0; $('dayp').classList.remove('hidden');
  }
  $('dpBody').addEventListener('click', e => { if (e.target.id === 'dpGo'){ sel = e.target.dataset.d; tab = 'day'; $('dayp').classList.add('hidden'); render(); centerDay(true); window.scrollTo(0,0); } });
  $('days').addEventListener('click', e => { const d = e.target.closest('.day'); if (d) openDay(d.dataset.d); });

  /* 按住 ⠿ 拖動卡片排序 */
  /* 按住卡片約 0.3 秒 → 卡片浮起來就能拖動排序；輕點是記一組；直接滑是捲動畫面 */
  let drag = null, press = null, justDragged = false;
  $('view').addEventListener('pointerdown', e => {
    const xc = e.target.closest('#view .xc'); if (!xc || e.button > 0) return;
    const onBtn = !!e.target.closest('button');  // 從按鈕上開始也能左滑，但不啟動長按拖動
    const el = xc.closest('.swrap');
    sw = { el, card:xc, x0:e.clientX, y0:e.clientY, base: swOpen === el ? -SWW : 0, mode:null };
    if (swOpen && swOpen !== el) closeSw();
    if (swOpen === el || onBtn) return;  // 已打開的卡片、或按在按鈕上：不啟動長按拖動
    press = { el, x:e.clientX, y:e.clientY, t:setTimeout(() => { sw = null; startDrag(el, press.y); }, 300) };
  });
  function cancelPress(){ if (press){ clearTimeout(press.t); press = null; } }
  function startDrag(el, y){
    press = null;
    const list = [...document.querySelectorAll('#view .swrap')], from = list.indexOf(el);
    const gap = parseFloat(getComputedStyle(el).marginBottom) || 12;
    drag = { el, list, from, to:from, y0:y, py:y, sy0:window.scrollY, gap,
      mids: list.map(x => { const r = x.getBoundingClientRect(); return r.top + window.scrollY + r.height/2; }), h: el.getBoundingClientRect().height };
    list.forEach(x => x !== el && x.classList.add('shift'));
    el.classList.add('dragging'); document.body.classList.add('drag-on');
    if (navigator.vibrate) navigator.vibrate(15);
    tick();
  }
  window.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive:false });
  $('view').addEventListener('contextmenu', e => { if (e.target.closest('.xc')) e.preventDefault(); });

  /* 左滑卡片 → 露出右邊的「移除」按鈕 */
  const SWW = 88; let sw = null, swOpen = null;
  function setSw(el, off, anim){
    const c = el.querySelector('.xc'), b = el.querySelector('.swdel');
    c.classList.toggle('moving', !anim); b.classList.toggle('moving', !anim);
    c.style.transform = off ? 'translateX(' + off + 'px)' : ''; b.style.width = Math.max(0, -off - 8) + 'px';
  }
  function closeSw(){ if (swOpen){ setSw(swOpen, 0, true); swOpen = null; armed = null; } }
  document.addEventListener('pointerdown', e => { if (swOpen && !e.target.closest('.swrap')) closeSw(); });
  function place(){
    const d = drag, dy = d.py - d.y0 + (window.scrollY - d.sy0), c = d.mids[d.from] + dy;
    d.el.style.transform = 'translateY(' + dy + 'px)';
    let to = d.from;
    d.mids.forEach((m, i) => { if (i < d.from && c < m) to = Math.min(to, i); if (i > d.from && c > m) to = Math.max(to, i); });
    d.to = to;
    d.list.forEach((x, i) => { if (x === d.el) return;
      const off = (to < d.from && i >= to && i < d.from) ? d.h + d.gap : (to > d.from && i > d.from && i <= to) ? -(d.h + d.gap) : 0;
      x.style.transform = off ? 'translateY(' + off + 'px)' : ''; });
  }
  function tick(){
    if (!drag) return;
    const H = window.innerHeight, top = document.querySelector('header').getBoundingClientRect().bottom + 30, bot = H - 110;
    if (drag.py < top) window.scrollBy(0, -Math.min(10, Math.ceil((top - drag.py) / 6)));
    else if (drag.py > bot) window.scrollBy(0, Math.min(10, Math.ceil((drag.py - bot) / 6)));
    place(); requestAnimationFrame(tick);
  }
  window.addEventListener('pointermove', e => {
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) cancelPress();
    if (drag){ drag.py = e.clientY; e.preventDefault(); return; }
    if (sw){ const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
      if (!sw.mode){ if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) sw.mode = 'h'; else if (Math.abs(dy) > 10) { sw = null; return; } }
      if (sw.mode === 'h'){ e.preventDefault(); cancelPress(); const off = Math.max(-SWW - 24, Math.min(0, sw.base + dx)); sw.off = off; setSw(sw.el, off, false); } }
  }, { passive:false });
  function endDrag(){
    cancelPress();
    if (sw){ const s2 = sw; sw = null;
      if (s2.mode === 'h'){ const open = s2.off < -SWW / 2; setSw(s2.el, open ? -SWW : 0, true); swOpen = open ? s2.el : null; if (!open) armed = null;
        justDragged = true; setTimeout(() => justDragged = false, 250); return; } }
    if (!drag) return; const d = drag; drag = null; justDragged = true; setTimeout(() => justDragged = false, 250);
    document.body.classList.remove('drag-on');
    if (d.to !== d.from){ const cs = day(sel).cards, [m] = cs.splice(d.from, 1); cs.splice(d.to, 0, m); save(); }
    render();
    const el = document.querySelector('[data-card="' + d.el.dataset.w + '"]'); if (el && d.to !== d.from) el.classList.add('moved');
  }
  window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);

  /* 選肌群：自動帶入預設動作；取消時拿掉還沒記錄的卡片 */
  $('groups').addEventListener('click', e => {
    const b = e.target.closest('.g'); if (!b) return;
    const g = b.dataset.g, D = day(sel);
    if (D.groups.includes(g)){
      D.groups = D.groups.filter(x => x !== g);
      const keep = D.cards.filter(c => c.g === g && c.sets.length).length;
      D.cards = D.cards.filter(c => c.g !== g || c.sets.length);
      if (keep) toast('已有紀錄的 ' + keep + ' 張卡片保留下來');
    } else {
      D.groups.push(g);
      const add = S.defaults[g].filter(n => !D.cards.some(c => c.ex === n));
      add.forEach(n => D.cards.push({ id:uid(), ex:n, g, sets:[] }));
      if (!S.defaults[g].length) toast(GN[g] + '還沒有預設動作，按 ＋ 自己加，或到設定裡設定');
      else if (add.length) toast('帶入 ' + add.length + ' 個' + GN[g] + '動作');
    }
    save(); render();
  });

  /* ===== 頁面 ===== */
  function lastSet(ex, beforeDate){
    const ds = Object.keys(S.days).filter(d => d < beforeDate).sort().reverse();
    for (const d of ds){ const c = S.days[d].cards.find(c => c.ex === ex && work(c).length); if (c){ const ws = work(c); return { d, s:ws[ws.length-1], n:ws.length }; } }
    return null;
  }
  /* 依肌群分類統計 */
  function groupStats(D){
    const gs = G.filter(([k]) => D.cards.some(c => c.g === k));
    if (!gs.length) return '<div class="empty">還沒有動作。</div>';
    return '<div class="gst"><span></span><span class="label">動作</span><span class="label">組數</span><span class="label">訓練量</span>' + gs.map(([k,n]) => {
      const cs = D.cards.filter(c => c.g === k), sets = cs.reduce((a,c) => a + work(c).length, 0);
      const vol = cs.reduce((a,c) => a + work(c).reduce((b,s) => b + dw(s) * s.r, 0), 0);
      return '<b class="gn">' + n + '</b><span class="v"><b>' + cs.filter(c => work(c).length).length + '</b><small>/' + cs.length + '</small></span>' +
        '<span class="v"><b>' + sets + '</b></span><span class="v"><b>' + Math.round(vol).toLocaleString() + '</b><small>' + U() + '</small></span>';
    }).join('') + '</div>';
  }
  const work = c => c.sets.filter(s => !s.wu);   // 正式組（熱身組不算進統計和曲線）
  function setRows(c, ro){
    let n = 0;
    return c.sets.map((s,i) => { const sk = 'set-' + c.id + '-' + i;
      return '<div class="srow' + (s.wu ? ' wu' : '') + '"><span class="no">' + (s.wu ? '熱身' : '第 ' + (++n) + ' 組') + '</span><span class="wr">' + (s.w > 0 ? '<b>' + wtxt(s) + '</b><small>' + U() + '</small> × ' : '<small>徒手</small> × ') + '<b>' + s.r + '</b><small>下</small></span>' +
        (s.wu ? '<span class="fb wu">熱身組</span>' : '<span class="fb f' + s.f + '">' + FAIL[s.f] + '</span>') + (ro ? '' : '<button class="sx' + (armed === sk ? ' armed' : '') + '" data-sx="' + c.id + '" data-i="' + i + '">' + (armed === sk ? '刪除' : '✕') + '</button>') + '</div>'; }).join('');
  }
  function card(c, i){
    const k = 'card-' + c.id;
    let h = '<div class="swrap" data-w="' + c.id + '"><button class="swdel" data-rm="' + c.id + '">' + (armed === k ? '確定刪除？' : '移除') + '</button><div class="card xc" data-card="' + c.id + '"><div class="xh"><span class="ord">' + (i+1) + '</span><div class="nm">' + esc(c.ex) + '<span class="gt">' + GN[c.g] + '</span></div>' +
      '<button class="hbtn" data-hist="' + esc(c.ex) + '">訓練紀錄</button>' +
      '</div>';
    if (c.sets.length) h += '<div class="xsets">' + setRows(c) + '</div>';
    return h + '<div class="xadd" aria-label="記一組"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></div></div></div>';
  }
  function viewDay(){
    const D = S.days[sel] || { groups:[], cards:[] };
    let h = '<div class="card"><div class="sumhead"><b>' + label(sel) + '</b><span>' + (sel === TODAY ? '今天' : '') + '</span></div>' + groupStats(D) + '</div>';
    if (!D.cards.length) h += '<div class="card empty">在上面選今天要練的肌群，會自動帶入你設定好的動作。<br>也可以按下面的「新增動作」另外加。</div>';
    else h += '<h3>點卡片記一組・按住卡片可拖動排序・左滑可移除</h3>' + D.cards.map((c, i) => card(c, i)).join('');
    return h + '<button class="addcard" data-addcard><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>新增動作</button>';
  }
  /* ===== 進步曲線：每週「最重那一組」的 重量 × 次數 ===== */
  let chartEx = null;
  const monday = s => { const d = parse(s), w = (d.getDay() + 6) % 7; return iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - w)); };
  function weightedExercises(){
    const cnt = {};
    Object.values(S.days).forEach(D => D.cards.forEach(c => { if (c.sets.some(x => x.w > 0 && !x.wu)) cnt[c.ex] = (cnt[c.ex] || 0) + 1; }));
    return Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a]);
  }
  function exGroup(n){ for (const D of Object.values(S.days)){ const c = D.cards.find(c => c.ex === n); if (c) return c.g; } return null; }
  /* 時間跨度：一週、一個月用「每次訓練」一個點；半年以上用「每週」一個點 */
  const RANGES = [['w','一週',7],['m','一個月',30],['h','半年',182],['y','一年',365],['2y','二年',730],['all','二年以上',0]];
  let chartRange = 'h';
  function rangePoints(ex){
    const R = RANGES.find(r => r[0] === chartRange), daily = chartRange === 'w' || chartRange === 'm';
    const t = new Date(), from = R[2] ? iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() - R[2] + 1)) : '';
    const top = {};
    Object.keys(S.days).forEach(d => { if (d < from || d > TODAY) return;
      S.days[d].cards.forEach(c => { if (c.ex !== ex) return;
        c.sets.forEach(x => { if (!(x.w > 0) || x.wu) return; const k = daily ? d : monday(d), o = top[k];
          if (!o || x.w > o.w || (x.w === o.w && x.r > o.r)) top[k] = { w:x.w, lb:x.lb, r:x.r, d }; }); }); });
    const pts = Object.keys(top).sort().map(k => { const t = top[k], w = dw(t); return { k: k < from ? from : k, d:t.d, r:t.r, w, v: w * t.r }; });
    return { pts, daily, from: from || (pts[0] && pts[0].k) };
  }
  function chartCard(){
    const list = weightedExercises();
    if (!list.length) return '<div class="card"><div class="ctitle">進步曲線</div><div class="empty">有負重的訓練紀錄之後，這裡會畫出每個動作的進步曲線。</div></div>';
    if (!list.includes(chartEx)) chartEx = G.map(([k]) => list.find(n => exGroup(n) === k)).find(Boolean);
    return '<div class="card chartc"><div class="ctitle">進步曲線</div>' +
      '<div class="sel"><button type="button" class="selbtn" id="chSel" aria-haspopup="listbox"><span>' + esc(chartEx) + '</span><small>' + (GN[exGroup(chartEx)] || '') + '</small></button>' +
      '<div class="dd" id="chDD" role="listbox" hidden>' + G.map(([k,gn]) => { const ns = list.filter(n => exGroup(n) === k); return ns.length ? '<div class="ddg">' + gn + '</div>' + ns.map(n => '<button type="button" class="ddi' + (n === chartEx ? ' on' : '') + '" data-ex="' + esc(n) + '">' + esc(n) + '</button>').join('') : ''; }).join('') + '</div></div>' +
      '<div class="chead" id="chHead"></div><div class="chart" id="chart"></div>' +
      '<div class="rng" id="chRng">' + RANGES.map(([k,n]) => '<button class="' + (k === chartRange ? 'on' : '') + '" data-rng="' + k + '">' + n + '</button>').join('') + '</div>' +
      '<div class="hint" id="chHint"></div></div>';
  }
  function drawChart(){
    const box = $('chart'); if (!box) return;
    const { pts, daily, from } = rangePoints(chartEx), W = box.clientWidth || 320, L = 40, R = 14;
    $('chHint').textContent = (daily ? '每個點代表一次訓練' : '每個點代表一週') + '：取最重的那一組，上面畫它的重量、下面畫它的次數。點圖表可以看細節。';
    document.querySelectorAll('#chRng button').forEach(b => b.classList.toggle('on', b.dataset.rng === chartRange));
    if (!pts.length){ $('chHead').innerHTML = ''; box.innerHTML = '<div class="cempty">這段期間沒有這個動作的紀錄</div>'; return; }
    const first = pts[0], last = pts[pts.length - 1];
    const delta = (a, b, u) => { const d = Math.round((b - a) * 100) / 100; return pts.length < 2 ? '' : d === 0 ? '<em class="eq">持平</em>' : '<em class="' + (d > 0 ? 'up' : 'dn') + '">' + (d >= 0 ? '▲' : '▼') + ' ' + kg(Math.abs(d)) + u + '</em>'; };
    $('chHead').innerHTML = '<div><span class="label">' + (daily ? '最近一次' : '最近一週') + '・重量</span><b>' + kg(last.w) + '</b><small>' + U() + '</small>' + delta(first.w, last.w, U()) + '</div>' +
      '<div><span class="label">次數</span><b>' + last.r + '</b><small>下</small>' + delta(first.r, last.r, '下') + '</div>';
    const t0 = parse(from).getTime(), t1 = parse(TODAY).getTime(), span = Math.max(t1 - t0, 864e5);
    const X = k => L + (parse(k).getTime() - t0) / span * (W - L - R);
    // 日期刻度
    const days = span / 864e5, s0 = parse(from), ticks = [];
    if (days <= 8){ for (let i = 0; i <= days; i++) ticks.push(new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() + i)); }
    else if (days <= 40){ for (let i = 0; i <= days; i += 7) ticks.push(new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() + i)); }
    else { const every = days <= 400 ? (days <= 200 ? 1 : 2) : days <= 800 ? 3 : 6;
      let m = new Date(s0.getFullYear(), Math.ceil((s0.getMonth() + (s0.getDate() > 1 ? 1 : 0)) / every) * every, 1);
      while (m.getTime() <= t1){ ticks.push(m); m = new Date(m.getFullYear(), m.getMonth() + every, 1); } }
    const short = days <= 40, dotR = pts.length > 60 ? 0 : pts.length > 30 ? 1.8 : 2.6;
    // 畫一張小圖：get 取值、cls 線條樣式、H 高度、withX 是否畫日期
    const panel = (id, title, unit, get, cls, H, withX) => {
      const T = 10, B = withX ? 24 : 8, vals = pts.map(get);
      const hi = Math.max(...vals), lo = Math.min(...vals), pad = Math.max(0, hi * 0.3 - (hi - lo)) / 2;
      const step = niceStep((hi + pad - Math.max(0, lo - pad)) / 3 || 1), y0 = Math.max(0, Math.floor(Math.max(0, lo - pad) / step) * step), y1 = Math.ceil((hi + pad) / step) * step || step;
      const Y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
      let g = '';
      for (let v = y0; v <= y1 + 1e-6; v += step) g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="yl" x="' + (L - 8) + '" y="' + (Y(v) + 4) + '">' + kg(Math.round(v * 10) / 10) + '</text>';
      if (withX) ticks.forEach(d => { const x = X(iso(d)); if (x < L + 8 || x > W - R - 8) return;
        g += '<text class="xl" x="' + x + '" y="' + (H - 6) + '">' + (short ? (d.getMonth() + 1) + '/' + d.getDate() : d.getMonth() === 0 ? d.getFullYear() + '' : (d.getMonth() + 1) + '月') + '</text>'; });
      const path = pts.map((p, i) => (i ? 'L' : 'M') + X(p.k).toFixed(1) + ' ' + Y(get(p)).toFixed(1)).join(' ');
      const area = path + ' L' + X(last.k).toFixed(1) + ' ' + (H - B) + ' L' + X(first.k).toFixed(1) + ' ' + (H - B) + ' Z';
      return { Y, html: '<div class="ptitle">' + title + '<small>（' + unit + '）</small></div><svg data-p="' + id + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" class="' + cls + '" role="img" aria-label="' + esc(chartEx) + ' ' + title + '">' +
        '<defs><linearGradient id="fill-' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".2"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>' + g +
        (pts.length > 1 ? '<path d="' + area + '" fill="url(#fill-' + id + ')"/><path d="' + path + '" class="ln"/>' : '') +
        (dotR ? pts.map(p => '<circle class="dt" cx="' + X(p.k) + '" cy="' + Y(get(p)) + '" r="' + dotR + '"/>').join('') : '') +
        '<circle class="dt end" cx="' + X(last.k) + '" cy="' + Y(get(last)) + '" r="4"/>' +
        '<line class="cx" y1="' + T + '" y2="' + (H - B) + '" style="display:none"/><circle class="dt hot" r="5.5" style="display:none"/>' +
        '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent"/></svg>' };
    };
    const pw = panel('w', '重量', U(), p => p.w, 'pw', 150, false), pr = panel('r', '次數', '下', p => p.r, 'pr', 130, true);
    box.innerHTML = pw.html + pr.html + '<div class="tip" id="chTip"></div>';
    const tip = $('chTip'), svgs = [...box.querySelectorAll('svg')], Ys = { w: [pw.Y, p => p.w], r: [pr.Y, p => p.r] };
    const show = e => {
      const r = svgs[0].getBoundingClientRect(), x = e.clientX - r.left;
      let best = pts[0]; pts.forEach(p => { if (Math.abs(X(p.k) - x) < Math.abs(X(best.k) - x)) best = p; });
      const px = X(best.k), md = parse(best.d);
      svgs.forEach(sv => { const [Y, get] = Ys[sv.dataset.p], cx = sv.querySelector('.cx'), cp = sv.querySelector('.hot');
        cx.setAttribute('x1', px); cx.setAttribute('x2', px); cx.style.display = ''; cp.setAttribute('cx', px); cp.setAttribute('cy', Y(get(best))); cp.style.display = ''; });
      tip.innerHTML = '<b>' + kg(best.w) + U() + ' × ' + best.r + ' 下</b><span>' + Math.round(best.v).toLocaleString() + ' ' + U() + '</span><span>' + md.getFullYear() + '/' + (md.getMonth() + 1) + '/' + md.getDate() + '（' + WK[md.getDay()] + '）</span>';
      tip.style.display = 'block';
      const tw = tip.offsetWidth, top = r.top - box.getBoundingClientRect().top + pw.Y(best.w);
      tip.style.left = (px > W / 2 ? px - tw - 12 : px + 12) + 'px'; tip.style.top = Math.max(top - tip.offsetHeight / 2, 0) + 'px';
    };
    const hide = () => { tip.style.display = 'none'; svgs.forEach(sv => { sv.querySelector('.cx').style.display = 'none'; sv.querySelector('.hot').style.display = 'none'; }); };
    svgs.forEach(sv => { sv.addEventListener('pointermove', show); sv.addEventListener('pointerdown', show); sv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); }); });
  }

  /* 動作卡片的「訓練紀錄」：彈出這個動作的進步曲線 */
  function openHist(ex){
    chartEx = ex; $('hpTitle').textContent = ex;
    $('hpBody').innerHTML = weightedExercises().includes(ex)
      ? '<div class="chead" id="chHead"></div><div class="chart" id="chart"></div><div class="rng" id="chRng">' + RANGES.map(([k,n]) => '<button class="' + (k === chartRange ? 'on' : '') + '" data-rng="' + k + '">' + n + '</button>').join('') + '</div><div class="hint" id="chHint"></div>'
      : '<div class="cempty" style="height:140px">' + (Object.values(S.days).some(D => D.cards.some(c => c.ex === ex && c.sets.length)) ? '徒手動作沒有重量，無法畫進步曲線' : '還沒有這個動作的紀錄') + '</div>';
    $('hisp').classList.remove('hidden'); drawChart();
  }
  const closeHist = () => { $('hisp').classList.add('hidden'); $('hpBody').innerHTML = ''; };
  $('hpClose').addEventListener('click', closeHist);
  $('hisp').addEventListener('click', e => { if (e.target.id === 'hisp') closeHist(); });
  $('hpBody').addEventListener('click', e => { const rg = e.target.closest('[data-rng]'); if (rg){ chartRange = rg.dataset.rng; drawChart(); } });
  function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

  /* 訓練紀錄：月曆，有訓練的日子亮黃框，點日期彈出當天內容 */
  let calY = new Date().getFullYear(), calM = new Date().getMonth();
  function viewHistory(){
    const first = new Date(calY, calM, 1), n = new Date(calY, calM + 1, 0).getDate();
    const trained = d => S.days[d] && S.days[d].cards.some(c => c.sets.length);
    let cnt = 0, cells = '';
    for (let i = 0; i < first.getDay(); i++) cells += '<span class="cd blank"></span>';
    for (let d = 1; d <= n; d++){
      const k = calY + '-' + pad(calM + 1) + '-' + pad(d), t = trained(k); if (t) cnt++;
      cells += '<button class="cd' + (t ? ' on' : '') + (k === TODAY ? ' today' : '') + (k > TODAY ? ' future' : '') + '" data-cal="' + k + '">' + d + '</button>';
    }
    const isNow = calY === new Date().getFullYear() && calM === new Date().getMonth();
    return chartCard() + '<div class="card cal"><div class="calnav"><button class="x" data-cm="-1" aria-label="上個月">‹</button><div><b>' + calY + '年' + (calM + 1) + '月</b><small>這個月訓練 ' + cnt + ' 天</small></div>' +
      '<button class="x" data-cm="1" aria-label="下個月"' + (isNow ? ' disabled' : '') + '>›</button></div>' +
      '<div class="calgrid">' + WK.map(w => '<span class="wkh">' + w + '</span>').join('') + cells + '</div></div>' +
      (isNow ? '' : '<button class="btn" data-cm="0" style="width:100%">回到這個月</button>');
  }

  const ILL_HALF = ['chest','back','leg','core'];   // 只顯示左半邊，中線貼齊卡片右緣
  const illSvg = g => ILL_IMG[g] ? '<img class="mill' + (ILL_HALF.includes(g) ? ' half' : '') + '" src="' + ILL_IMG[g] + '" alt="">' : '';

  /* 常練動作：每個肌群一張方形卡片 */
  function viewMoves(){
    return '<h3>點肌群卡片，編輯選這個肌群時會自動帶入的動作</h3><div class="mgrid">' + G.map(([k,n]) => {
      const d = S.defaults[k];
      return '<button class="mcard" data-mg="' + k + '">' + illSvg(k) + '<span class="mn">' + n + '</span><span class="mc"><b>' + d.length + '</b> 個動作</span>' +
        '<span class="ml">' + (d.length ? (d.length > 3 ? d.slice(0,2).map(esc).join('<br>') + '<br>⋯' : d.map(esc).join('<br>')) : '尚未設定') + '</span></button>';
    }).join('') + '</div>';
  }
  function viewSettings(){
    let h = '<h3>你的名字</h3><div class="card"><input id="stName" maxlength="12" placeholder="顯示在最上面的問候" value="' + esc(S.name) + '"></div>';
    h += '<h3>資料</h3><div class="card"><button class="btn danger' + (armed === 'reset' ? ' armed' : '') + '" id="stReset" style="width:100%">' +
      (armed === 'reset' ? '再按一次：全部清除' : '清除所有資料') + '</button><div class="hint">資料只存在這支手機裡。</div></div>';
    return h;
  }
  function render(){
    swOpen = null;
    renderHeader();
    $('view').innerHTML = tab === 'day' ? viewDay() : tab === 'history' ? viewHistory() : tab === 'moves' ? viewMoves() : viewSettings();
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    if (tab === 'history') drawChart();
  }

  $('view').addEventListener('click', e => {
    if (justDragged) return;
    if (swOpen && !e.target.closest('.swdel')){ closeSw(); return; }
    const rm = e.target.closest('[data-rm]');
    if (rm){ const k = 'card-' + rm.dataset.rm, has = day(sel).cards.find(c => c.id === rm.dataset.rm).sets.length;
      if (armed === k || !has){ const D = day(sel); D.cards = D.cards.filter(c => c.id !== rm.dataset.rm); armed = null; save(); render(); toast('已移除'); }
      else { armed = k; rm.textContent = '確定刪除？'; clearTimeout(armT); armT = setTimeout(() => { armed = null; if (rm.isConnected) rm.textContent = '移除'; }, 3000); }
      return; }
    const sx = e.target.closest('[data-sx]');
    if (sx){ const k = 'set-' + sx.dataset.sx + '-' + sx.dataset.i;
      if (armed === k){ day(sel).cards.find(c => c.id === sx.dataset.sx).sets.splice(+sx.dataset.i, 1); armed = null; save(); render(); toast('已刪除這一組'); } else arm(k); return; }
    if (e.target.closest('[data-addcard]')){ openPick(); return; }
    const hb = e.target.closest('[data-hist]'); if (hb){ openHist(hb.dataset.hist); return; }
    const cd = e.target.closest('[data-card]'); if (cd){ openSet(cd.dataset.card); return; }
    const rg = e.target.closest('[data-rng]'); if (rg){ chartRange = rg.dataset.rng; drawChart(); return; }
    const cl = e.target.closest('[data-cal]'); if (cl){ openDay(cl.dataset.cal); return; }
    const cm = e.target.closest('[data-cm]');
    if (cm && !cm.disabled){ const v = +cm.dataset.cm; if (v){ calM += v; if (calM < 0){ calM = 11; calY--; } if (calM > 11){ calM = 0; calY++; } } else { calY = new Date().getFullYear(); calM = new Date().getMonth(); } render(); return; }
    const mg = e.target.closest('[data-mg]'); if (mg){ openMg(mg.dataset.mg); return; }
    if (e.target.id === 'stReset'){ if (armed === 'reset'){ try{ localStorage.removeItem(KEY); }catch(_){} mem = null; location.reload(); } else arm('reset'); }
  });
  /* 進步曲線的動作選單（自訂樣式） */
  document.addEventListener('click', e => {
    const dd = $('chDD'); if (!dd) return;
    if (e.target.closest('#chSel')){ dd.hidden = !dd.hidden; $('chSel').classList.toggle('open', !dd.hidden); if (!dd.hidden){ const on = dd.querySelector('.on'); if (on) dd.scrollTop = on.offsetTop - dd.clientHeight / 2; } return; }
    const it = e.target.closest('#chDD .ddi');
    if (it){ chartEx = it.dataset.ex; $('chSel').querySelector('span').textContent = chartEx; $('chSel').querySelector('small').textContent = GN[exGroup(chartEx)] || '';
      dd.querySelectorAll('.ddi').forEach(b => b.classList.toggle('on', b === it)); drawChart(); }
    if (!e.target.closest('#chDD .ddg')){ dd.hidden = true; $('chSel').classList.remove('open'); }
  });
  $('view').addEventListener('change', e => { if (e.target.id === 'stName'){ S.name = e.target.value.trim(); save(); renderHeader(); toast('已儲存'); } });
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; tab = b.dataset.tab; armed = null; render(); window.scrollTo(0,0); if (tab === 'day') centerDay(false);
  });
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => $(b.dataset.close).classList.add('hidden')));
  document.querySelectorAll('.pop').forEach(p => p.addEventListener('click', e => { if (e.target === p) p.classList.add('hidden'); }));

  /* 「新增」按鈕或鍵盤上的完成鍵 */
  function onAdd(inputId, fn){ $(inputId + '').nextElementSibling.addEventListener('click', fn); $(inputId).addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); fn(); } }); }

  /* ===== 記一組 ===== */
  let cur = null, fail = null;
  let stype = 'work';
  function setFail(f){ fail = f; document.querySelectorAll('#sFail .fail').forEach(b => b.classList.toggle('on', +b.dataset.f === f)); $('sSave').classList.toggle('ready', stype === 'wu' || f != null); }
  function setType(t){
    stype = t; document.querySelectorAll('#sType button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    $('sFailBox').style.display = t === 'wu' ? 'none' : '';
    $('sNo').textContent = GN[cur.g] + '・' + (t === 'wu' ? '熱身組' : '第 ' + (work(cur).length + 1) + ' 組');
    // 帶入數字：同一種組別的上一組；正式組沒有的話用上次訓練的最後一組
    const same = cur.sets.filter(s => !!s.wu === (t === 'wu')), prev = same.length ? { s:same[same.length-1] } : t === 'work' ? lastSet(cur.ex, sel) : null;
    if (prev){ $('sW').value = wtxt(prev.s); $('sR').value = prev.s.r; }
    $('sLast').textContent = same.length ? '已帶入上一組' + (t === 'wu' ? '熱身組' : '') + '的重量和次數' : prev ? '已帶入上次（' + label(prev.d).replace(/（.*/, '') + '）最後一組的數字' : '';
    setFail(fail);
  }
  function openSet(id){
    cur = day(sel).cards.find(c => c.id === id); if (!cur) return;
    $('sName').textContent = cur.ex; $('sW').value = 0; $('sR').value = 10; fail = null;
    const last = cur.sets[cur.sets.length - 1];
    showUnit(); setType(last && last.wu ? 'wu' : 'work'); setFail(null); $('setp').classList.remove('hidden');
  }
  function showUnit(){ document.querySelectorAll('#sUnit button').forEach(b => b.classList.toggle('on', b.dataset.u === U())); }
  $('sUnit').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.u === U()) return;
    const v = parseFloat($('sW').value) || 0;   // 輸入框裡的數字一起換算
    $('sW').value = kg(b.dataset.u === 'lb' ? Math.round(v / LB * 2) / 2 : Math.round(v * LB * 4) / 4);
    S.unit = b.dataset.u; save(); showUnit(); render();
    toast('重量單位改為' + (U() === 'lb' ? '磅（lb）' : '公斤（kg）'));
  });
  $('sType').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setType(b.dataset.t); });
  document.querySelectorAll('.stp .ctl button').forEach(b => b.addEventListener('click', () => {
    const inp = b.dataset.k === 'w' ? $('sW') : $('sR'), step = b.dataset.k === 'w' ? Math.sign(+b.dataset.d) * (U() === 'lb' ? 5 : 2.5) : +b.dataset.d, v = (parseFloat(inp.value) || 0) + step;
    inp.value = b.dataset.k === 'w' ? kg(Math.max(0, Math.min(999, v))) : Math.max(1, Math.min(999, Math.round(v)));
  }));
  $('sW').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1').slice(0,6); });
  $('sR').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,3); });
  $('sFail').addEventListener('click', e => { const b = e.target.closest('.fail'); if (b) setFail(+b.dataset.f); });
  $('sSave').addEventListener('click', () => {
    const w = parseFloat($('sW').value) || 0, r = parseInt($('sR').value);
    if (!(r > 0)){ toast('次數要大於 0'); return; }
    if (stype === 'work' && fail == null){ toast('請選擇力竭程度'); return; }
    const unit = U() === 'lb' ? { w: w * LB, lb: w } : { w };
    cur.sets.push(Object.assign(unit, stype === 'wu' ? { r, wu:true, t:Date.now() } : { r, f:fail, t:Date.now() })); save();
    $('setp').classList.add('hidden'); render();
    toast(cur.ex + (stype === 'wu' ? ' 熱身組已記錄' : ' 第 ' + work(cur).length + ' 組已記錄'));
  });

  /* ===== 新增動作卡片 ===== */
  let pg = 'chest';
  function renderPick(){
    const D = S.days[sel] || { cards:[] };
    $('pTabs').innerHTML = G.map(([k,n]) => '<button type="button" class="g' + (k === pg ? ' on' : '') + '" data-g="' + k + '">' + n + '</button>').join('');
    $('pList').innerHTML = allOf(pg).map(n => '<button type="button" class="chip' + (D.cards.some(c => c.ex === n) ? ' has' : '') + (LIB[pg].includes(n) ? '' : ' mine') + '" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('');
  }
  function addCard(n, g){
    const D = day(sel);
    if (D.cards.some(c => c.ex === n)){ toast('今天已經有「' + n + '」了'); return; }
    D.cards.push({ id:uid(), ex:n, g, sets:[] }); save(); $('pick').classList.add('hidden'); render();
    toast('已加入「' + n + '」');
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' }), 50);
  }
  function openPick(){ const D = S.days[sel]; pg = (D && D.groups[0]) || pg; renderPick(); $('pNew').value = ''; $('pick').classList.remove('hidden'); }
  $('pTabs').addEventListener('click', e => { const b = e.target.closest('.g'); if (b){ pg = b.dataset.g; renderPick(); } });
  $('pList').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) addCard(c.dataset.n, pg); });
  onAdd('pNew', () => { const v = $('pNew').value.trim(); if (!v) return;
    if (!allOf(pg).includes(v)){ S.custom[pg].push(v); save(); }
    addCard(v, pg);
  });

  /* ===== 常練動作：編輯某肌群的預設動作（改了立刻存） ===== */
  let mgG = null;
  function renderMg(){
    const g = mgG, on = S.defaults[g];
    $('mgTitle').textContent = GN[g];
    $('mgOn').innerHTML = on.length ? on.map(n => '<button type="button" class="chip rm" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('') : '<div class="empty">還沒有，從下面點選加入。</div>';
    const off = allOf(g).filter(n => !on.includes(n));
    $('mgOff').innerHTML = off.map(n => '<button type="button" class="chip add' + (LIB[g].includes(n) ? '' : ' mine') + '" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('') || '<div class="empty">全部都加入了。</div>';
  }
  function openMg(g){ mgG = g; renderMg(); $('mgNew').value = ''; $('mgp').querySelector('.pscroll').scrollTop = 0; $('mgp').classList.remove('hidden'); }
  $('mgOn').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return;
    S.defaults[mgG] = S.defaults[mgG].filter(n => n !== c.dataset.n); save(); renderMg(); render(); toast('已移除「' + c.dataset.n + '」'); });
  $('mgOff').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return;
    S.defaults[mgG].push(c.dataset.n); save(); renderMg(); render(); toast('已加入「' + c.dataset.n + '」'); });
  onAdd('mgNew', () => { const v = $('mgNew').value.trim(); if (!v) return;
    if (!allOf(mgG).includes(v)){ S.custom[mgG].push(v); }
    if (!S.defaults[mgG].includes(v)) S.defaults[mgG].push(v);
    save(); $('mgNew').value = ''; renderMg(); render(); toast('已加入「' + v + '」'); });

  /* ===== 首次設定／編輯預設動作 ===== */
  let oQueue = [], oi = 0, oSel = {};
  function openOnb(groups){
    oQueue = groups; oi = 0; oSel = {};
    groups.forEach(g => oSel[g] = S.defaults[g].slice());
    $('onb').classList.remove('hidden'); document.body.classList.add('onb-open'); renderOnb();
  }
  function renderOnb(){
    const g = oQueue[oi], first = !S.setupDone, many = oQueue.length > 1;
    $('oDots').innerHTML = many ? oQueue.map((_, i) => '<i class="' + (i <= oi ? 'on' : '') + '"></i>').join('') : '';
    $('oStep').textContent = many ? '第 ' + (oi+1) + ' / ' + oQueue.length + ' 步' : '編輯預設動作';
    $('oTitle').innerHTML = (first && oi === 0 ? '先設定你常做的動作<br>' : '') + '<em>' + GN[g] + '</em>的常用動作';
    $('oList').innerHTML = allOf(g).map(n => '<button type="button" class="chip' + (oSel[g].includes(n) ? ' on' : '') + (LIB[g].includes(n) ? '' : ' mine') + '" data-n="' + esc(n) + '">' + esc(n) + '</button>').join('');
    $('oList').scrollTop = 0;
    $('oCount').textContent = oSel[g].length ? '已選 ' + oSel[g].length + ' 個：選' + GN[g] + '時會自動帶入這些動作' : '不選也可以，之後在設定裡隨時能改';
    $('oBack').style.display = oi > 0 ? '' : (first ? 'none' : '');
    $('oBack').textContent = oi > 0 ? '上一步' : '取消';
    $('oNext').textContent = oi < oQueue.length - 1 ? '下一步' : (first ? '完成，開始訓練' : '儲存');
  }
  $('oList').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return; const g = oQueue[oi], n = c.dataset.n;
    oSel[g] = oSel[g].includes(n) ? oSel[g].filter(x => x !== n) : oSel[g].concat(n); renderOnb();
  });
  onAdd('oNew', () => { const g = oQueue[oi], v = $('oNew').value.trim(); if (!v) return;
    if (!allOf(g).includes(v)){ S.custom[g].push(v); save(); }
    if (!oSel[g].includes(v)) oSel[g].push(v);
    $('oNew').value = ''; renderOnb(); toast('已加入「' + v + '」');
  });
  const closeOnb = () => { $('onb').classList.add('hidden'); document.body.classList.remove('onb-open'); };
  $('oBack').addEventListener('click', () => { if (oi > 0){ oi--; renderOnb(); } else closeOnb(); });
  $('oNext').addEventListener('click', () => {
    if (oi < oQueue.length - 1){ oi++; renderOnb(); return; }
    oQueue.forEach(g => S.defaults[g] = oSel[g]);
    const first = !S.setupDone; S.setupDone = true; save(); closeOnb(); render(); centerDay(false);
    toast(first ? '設定完成！在上方選今天要練的肌群' : '已更新' + GN[oQueue[0]] + '的預設動作');
  });

  if (DEMO && !Object.values(S.days).some(D => D.cards.some(c => c.sets.length))) seedDemo();
  render(); centerDay(false);
  if (!S.setupDone) openOnb(G.map(([k]) => k));
})();
</script>
<script>
(() => {
  // 離線也能打開：註冊 service worker
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  // iPhone 用 Safari 開、還沒加到主畫面時，提示加到主畫面（資料才會一直保留）
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  let seen = false; try { seen = localStorage.getItem('a2hs-dismissed') === '1'; } catch (e) {}
  if (ios && !standalone && !seen) {
    const d = document.createElement('div'); d.id = 'a2hs';
    d.innerHTML = '請點 Safari 下方的 <b>分享</b> 按鈕，選 <b>加入主畫面</b>，之後從桌面圖示打開。<br>直接在 Safari 裡使用，太久沒打開時資料可能會被清除。<button aria-label="關閉">✕</button>';
    d.querySelector('button').onclick = () => { d.remove(); try { localStorage.setItem('a2hs-dismissed', '1'); } catch (e) {} };
    document.body.appendChild(d);
  }
})();
</script>
</body>
